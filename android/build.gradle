apply plugin: 'com.android.library'

// AGP 9 compiles Kotlin itself and refuses the Kotlin plugin, unless the app opted out with
// android.builtInKotlin=false, in which case nothing compiles Kotlin without the plugin.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def hasBuiltInKotlin = agpMajor >= 9 && providers.gradleProperty('android.builtInKotlin').getOrElse('true') != 'false'
if (!hasBuiltInKotlin) {
  apply plugin: 'org.jetbrains.kotlin.android'
}

group = 'expo.modules.huawei'
version = new groovy.json.JsonSlurper().parse(file('../package.json')).version

android {
  namespace = 'expo.modules.huawei'
  compileSdk = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
  defaultConfig {
    minSdk = rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
    consumerProguardFiles 'proguard-rules.pro'
  }
  lint {
    abortOnError = false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.huawei.hms:appservice:6.12.0.300'
  implementation 'com.huawei.hms:iap:6.16.6.305'
  implementation 'com.huawei.hms:safetydetect:6.7.0.305'
  implementation 'com.huawei.hms:push:6.13.0.301'
}
